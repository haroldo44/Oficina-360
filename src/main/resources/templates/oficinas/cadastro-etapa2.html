<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Etapa 2</title>
    <link rel="stylesheet" th:href="@{/css/cadastro-etapa2-oficina.css}">
</head>
<body>

<div class="container">
    <h2 class="titulo">Finalizando a sua conta</h2>
    <div class="linha"></div>

    <form th:action="@{/oficinas/cadastro/etapa2}"
          th:object="${dto}" method="post" enctype="multipart/form-data"
          class="form-grid">

        <div class="col-esq">
            <div class="img-box">
                <div class="img-preview"><img id="previewOficina" src="" alt=""></div>
                <label class="upload-label">
                    Adicione imagens da sua oficina
                    <input type="file" name="imagemOficinaArquivo" accept="image/*"
                           onchange="previewImage(event, 'previewOficina')">
                </label>
            </div>

            <label>Nome da oficina</label>
            <input type="text" th:field="*{nomeDaOficina}" placeholder="Digite o nome da oficina">
            <label>CNPJ</label>
            <input type="text" th:field="*{cnpj}" placeholder="Digite seu CNPJ">
            <label>Cidade</label>
            <input type="text" th:field="*{cidade}" placeholder="Digite o nome da cidade">
            <label>Bairro</label>
            <input type="text" th:field="*{bairro}" placeholder="Digite o nome do bairro">
            <label>Rua</label>
            <input type="text" th:field="*{rua}" placeholder="Digite o nome da rua">
        </div>

        <div class="col-dir">
            <div class="img-box">
                <div class="img-preview perfil"><img id="previewProprietario" src="" alt=""></div>
                <label class="upload-label">
                    Adicione uma foto sua
                    <input type="file" name="fotoProprietarioArquivo" accept="image/*"
                           onchange="previewImage(event, 'previewProprietario')">
                </label>
            </div>

            <label>Nome</label>
            <input type="text" th:field="*{nomeDoProprietario}" placeholder="Digite o seu nome">
            <label>Número de telefone</label>
            <input type="text" th:field="*{telefoneDoProprietario}" placeholder="Digite o número">
            <label>Cidade onde mora</label>
            <input type="text" th:field="*{cidadeDoProprietario}" placeholder="Cidade">
            <label>Bairro</label>
            <input type="text" th:field="*{bairroDoProprietario}" placeholder="Bairro">
            <label>Rua</label>
            <input type="text" th:field="*{ruaDoProprietario}" placeholder="Rua">

            <button type="submit" class="btn-finalizar">Finalizar</button>
        </div>
    </form>
</div>

<script>
function previewImage(event, previewId) {
    const reader = new FileReader();
    reader.onload = function() {
        document.getElementById(previewId).src = reader.result;
    };
    reader.readAsDataURL(event.target.files[0]);
}
</script>

</body>
</html>
