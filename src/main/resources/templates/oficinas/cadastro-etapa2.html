<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Etapa 2</title>
    <link rel="stylesheet" th:href="@{/css/cadastro-etapa2-oficina.css}">
</head>
<body>

<div class="container">
    <h2 class="titulo">Finalizando a sua conta</h2>
    <div class="linha"></div>

    <form th:action="@{/oficinas/cadastro/etapa2}"
          th:object="${dto}" method="post" enctype="multipart/form-data"
          class="form-grid">

        <div class="col-esq">
            <div class="img-box">
                <div class="img-preview"><img id="previewOficina" src="" alt=""></div>
                <label class="upload-label">
                    Adicione imagens da sua oficina
                    <input type="file" name="imagemOficinaArquivo" accept="image/*"
                           onchange="previewImage(event, 'previewOficina')">
                </label>
            </div>

            <label>Nome da oficina</label>
            <input type="text" th:field="*{nomeDaOficina}" placeholder="Digite o nome da oficina" required>
            
            <label>CNPJ</label>
            <input type="text" 
                   th:field="*{cnpj}" 
                   placeholder="XX.XXX.XXX/XXXX-XX" 
                   required
                   maxlength="18"
                   pattern="\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}"
                   title="Digite o CNPJ no formato XX.XXX.XXX/XXXX-XX"
                   oninput="mascaraCNPJ(this)">

            <label>Cidade</label>
            <input type="text" th:field="*{cidade}" placeholder="Digite o nome da cidade" required>
            
            <label>Bairro</label>
            <input type="text" th:field="*{bairro}" placeholder="Digite o nome do bairro" required>
            
            <label>Rua</label>
            <input type="text" th:field="*{rua}" placeholder="Digite o nome da rua" required>
        </div>

        <div class="col-dir">
            <div class="img-box">
                <div class="img-preview perfil"><img id="previewProprietario" src="" alt=""></div>
                <label class="upload-label">
                    Adicione uma foto sua
                    <input type="file" name="fotoProprietarioArquivo" accept="image/*"
                           onchange="previewImage(event, 'previewProprietario')">
                </label>
            </div>

            <label>Nome</label>
            <input type="text" th:field="*{nomeDoProprietario}" placeholder="Digite o seu nome" required>
            
            <label>Número de telefone</label>
            <input type="text" 
                   th:field="*{telefoneDoProprietario}" 
                   placeholder="(XX) XXXXX-XXXX" 
                   required
                   maxlength="15"
                   pattern="\(\d{2}\) \d{5}-\d{4}"
                   title="Digite o telefone no formato (xx) xxxxx-xxxx"
                   oninput="mascaraTelefone(this)">
            
            <label>Cidade onde mora</label>
            <input type="text" th:field="*{cidadeDoProprietario}" placeholder="Cidade" required>
            
            <label>Bairro</label>
            <input type="text" th:field="*{bairroDoProprietario}" placeholder="Bairro" required>
            
            <label>Rua</label>
            <input type="text" th:field="*{ruaDoProprietario}" placeholder="Rua" required>

            <button type="submit" class="btn-finalizar">Finalizar</button>
        </div>
    </form>
</div>

<script>
    // Preview das Imagens
    function previewImage(event, previewId) {
        const file = event.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById(previewId).src = reader.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // Máscara para Telefone: (00) 00000-0000
    function mascaraTelefone(input) {
        let v = input.value;
        v = v.replace(/\D/g,""); // Remove tudo o que não é dígito
        v = v.replace(/^(\d{2})(\d)/g,"($1) $2"); // Coloca parênteses em volta dos dois primeiros dígitos
        v = v.replace(/(\d)(\d{4})$/,"$1-$2"); // Coloca hífen entre o quinto e o sexto dígitos
        input.value = v;
    }

    // Máscara para CNPJ: 00.000.000/0000-00
    function mascaraCNPJ(input) {
        let v = input.value;
        v = v.replace(/\D/g,""); // Remove tudo o que não é dígito
        
        // Coloca ponto entre o segundo e o terceiro dígitos
        v = v.replace(/^(\d{2})(\d)/,"$1.$2");
        
        // Coloca ponto entre o quinto e o sexto dígitos
        v = v.replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3");
        
        // Coloca uma barra entre o oitavo e o nono dígitos
        v = v.replace(/\.(\d{3})(\d)/,".$1/$2");
        
        // Coloca um hífen depois do bloco de quatro dígitos
        v = v.replace(/(\d{4})(\d)/,"$1-$2");
        
        input.value = v;
    }
</script>

</body>
</html>
