<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página da Oficina</title>
    <link rel="stylesheet" th:href="@{/css/oficina-home.css}">
</head>
<body>

<header th:replace="~{fragments/header :: cabecalho}"></header>

<div class="container">

    <div th:if="${sucesso}" class="alerta-sucesso">
        <p th:text="${sucesso}"></p>
    </div>
    <div th:if="${erro}" class="alerta-erro">
        <p th:text="${erro}"></p>
    </div>

    <h2 class="titulo-centro">Imagem da oficina</h2>

    <div class="foto-oficina-box">
        <img class="foto-oficina"
             th:src="@{'/uploads/' + ${oficina.imagem}} + '?v=' + ${#dates.createNow().time}"
             id="previewFotoOficina"
             alt="Foto da Oficina">
        
        <button class="btn-alterar-foto" onclick="document.getElementById('inputFotoOficina').click();">
             Alterar foto
        </button>

        <form th:action="@{/oficinas/alterar-foto/{id}(id=${oficina.id})}"
              method="post"
              enctype="multipart/form-data"
              style="display:none;">
            <input type="file"
                   id="inputFotoOficina"
                   name="novaFoto"
                   accept="image/*"
                   onchange="this.form.submit()">
        </form>
    </div>

    <p class="id-oficina">ID: <span th:text="${oficina.id}"></span></p>

    <h2 class="titulo-centro">Informações</h2>

    <div style="width:100%; display:flex; justify-content:flex-end; margin-bottom:15px;">
        <button id="btnEditar" class="btn-editar">Editar</button>
        <button id="btnSalvar" class="btn-salvar" style="display:none;">Salvar</button>
        <button id="btnCancelar" class="btn-cancelar" style="display:none;">Cancelar</button>
    </div>

    <form id="formAtualizar"
          th:action="@{/oficinas/atualizar/{id}(id=${oficina.id})}"
          method="post">

        <div class="info-container">
            <div class="info-col-esq">
                <label>Nome</label>
                <input type="text" name="nomeDaOficina" th:value="${oficina.nomeDaOficina}" class="campo-editavel" readonly>

                <label>CNPJ</label>
                <input type="text" name="cnpj" th:value="${oficina.cnpj}" class="campo-editavel" readonly>

                <label>Cidade</label>
                <input type="text" name="cidade" th:value="${oficina.cidade}" class="campo-editavel" readonly>

                <label>Bairro</label>
                <input type="text" name="bairro" th:value="${oficina.bairro}" class="campo-editavel" readonly>

                <label>Rua</label>
                <input type="text" name="rua" th:value="${oficina.rua}" class="campo-editavel" readonly>
            </div>

            <div class="info-col-dir">
                <label>Número de telefone</label>
                <input type="text" name="telefoneDoProprietario" th:value="${oficina.telefoneDoProprietario}" class="campo-editavel" readonly>

                <label>Descrição</label>
                <textarea rows="11" name="descricao" class="campo-editavel" readonly
                          th:text="${oficina.descricao}">
                </textarea>
            </div>
        </div>
        <button id="btnSalvarForm" type="submit" style="display:none;"></button>
    </form>

    <h2 class="titulo-centro">Mecânicos</h2>

    <div class="botoes-mecanicos">
        <button class="btn-remover" id="btnToggleRemover">Remover</button>
        <button class="btn-adicionar" onclick="document.getElementById('modalAdicionarMecanico').style.display='block'">
            Adicionar
        </button>
    </div>

    <div class="mecanicos-grid">
        <div class="card-mecanico"
             th:each="mecanico : ${mecanicos}"
             th:id="'mecanico-' + ${mecanico.id}"
             th:classappend="${!mecanico.ativo} ? 'inativo' : ''"
             th:attr="data-id=${mecanico.id},
                      data-nome=${mecanico.nomeCompleto},
                      data-email=${mecanico.email},
                      data-senha=${mecanico.senha},
                      data-telefone=${mecanico.numeroTelefone},
                      data-manha-inicio=${mecanico.turnoManhaInicio},
                      data-manha-fim=${mecanico.turnoManhaFim},
                      data-tarde-inicio=${mecanico.turnoTardeInicio},
                      data-tarde-fim=${mecanico.turnoTardeFim},
                      data-foto=${mecanico.nomeArquivoFoto}"
             onclick="abrirModalEdicao(this)"
             style="cursor: pointer; position: relative;">

            <img th:if="${mecanico.nomeArquivoFoto != null}"
                 th:src="|/uploads/${mecanico.nomeArquivoFoto}?v=${#dates.createNow().time}|"
                 alt="Mecânico">

            <img th:unless="${mecanico.nomeArquivoFoto != null}"
                 th:src="@{/images/perfil-default.png}"
                 alt="Sem Foto">

            <p class="nome-mecanico" th:text="${mecanico.nomeCompleto}"></p>

            <form th:action="@{/mecanicos/{id}/status(id=${mecanico.id})}"
                  method="post"
                  style="margin-top:10px;"
                  onclick="event.stopPropagation()">

                <div th:if="${_csrf != null}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                </div>
                <input type="hidden" name="oficinaId" th:value="${oficina.id}">

                <button type="submit"
                        th:class="${mecanico.ativo} ? 'btn-desativar' : 'btn-ativar'">
                    <span th:text="${mecanico.ativo} ? 'Desativar' : 'Ativar'"></span>
                </button>
            </form>

            <button type="button" 
                    class="btn-remover-individual"
                    style="display:none; margin-top: 5px; background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; width: 100%;"
                    th:onclick="'abrirModalExclusao(event, ' + ${mecanico.id} + ', ' + ${oficina.id} + ')'">
                Remover
            </button>

        </div>

        <p th:if="${#lists.isEmpty(mecanicos)}"
           style="grid-column: span 4; text-align:center;">
            Nenhum mecânico cadastrado.
        </p>
    </div>
</div>

<div id="modalAdicionarMecanico" class="modal-custom" style="display:none;">
    <div class="modal-content-custom">
        <span class="close-btn" onclick="document.getElementById('modalAdicionarMecanico').style.display='none'">&times;</span>
        
        <h3 class="titulo-centro">Adicionando mecânico</h3>

        <form th:action="@{/mecanicos/adicionar/{oficinaId}(oficinaId=${oficina.id})}"
              method="post"
              enctype="multipart/form-data"
              th:object="${mecanicoDto}">

            <div th:if="${_csrf != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </div>

            <div style="text-align: center; margin-bottom: 20px;">
                <label for="inputFotoMecanico" style="cursor: pointer;">
                    <img id="previewFotoAdd" 
                         th:src="@{/images/Perfil.png}" 
                         style="width: 80px; height: 80px; border-radius: 50%; border: 0px solid #ddd; object-fit: cover;" 
                         alt="Adicionar foto">
                    <p>Adicionar foto</p>
                </label>
                <input type="file" id="inputFotoMecanico" name="fotoPerfil" accept="image/*" style="display:none;" onchange="previewImagemAdd(event)">
            </div>
            
            <label for="nomeCompleto">Nome completo</label>
            <input type="text" id="nomeCompleto" th:field="*{nomeCompleto}" required minlength="3" maxlength="100">

            <label for="email">Crie um email</label>
            <input type="email" id="email" th:field="*{email}" required>

            <label for="senha">Crie uma senha</label>
            <input type="password" id="senha" th:field="*{senha}" required minlength="3" maxlength="20">

            <label for="telefone">N° Telefone</label>
            <input type="tel" id="telefone" th:field="*{numeroTelefone}" required placeholder="(99) 99999-9999">
            
            <label>Horário de Trabalho</label>
            <div style="display:flex; justify-content:space-between; gap: 15px;">
                <div>
                    <label for="manhaInicio">Manhã Início</label>
                    <input type="time" id="manhaInicio" th:field="*{turnoManhaInicioString}" required>
                </div>
                <div>
                    <label for="manhaFim">Manhã Fim</label>
                    <input type="time" id="manhaFim" th:field="*{turnoManhaFimString}" required>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; gap: 15px; margin-top: 10px;">
                <div>
                    <label for="tardeInicio">Tarde Início</label>
                    <input type="time" id="tardeInicio" th:field="*{turnoTardeInicioString}" required>
                </div>
                <div>
                    <label for="tardeFim">Tarde Fim</label>
                    <input type="time" id="tardeFim" th:field="*{turnoTardeFimString}" required>
                </div>
            </div>
            
            <div style="display:flex; justify-content:space-between; margin-top: 20px;">
                <button type="button" onclick="document.getElementById('modalAdicionarMecanico').style.display='none'">Cancelar</button>
                <button type="submit" class="btn-finalizar">Finalizar</button>
            </div>
        </form>
    </div>
</div>

<div id="modalEditarMecanico" class="modal-custom" style="display:none;">
    <div class="modal-content-custom">
        <span class="close-btn" onclick="document.getElementById('modalEditarMecanico').style.display='none'">&times;</span>
        <h3 class="titulo-centro">Alterar informações do mecânico</h3>

        <form id="formEditarMecanico" method="post" enctype="multipart/form-data">
            <input type="hidden" name="oficinaId" th:value="${oficina.id}">
            <div th:if="${_csrf != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </div>
    
            <div style="text-align: center; margin-bottom: 20px;">
                <label for="editFotoMecanicoInput" style="cursor: pointer; display: inline-block;">
                    <img id="previewFotoEditar"
                         th:src="@{/images/Perfil.png}"
                         style="width: 80px; height: 80px; border-radius: 50%; border: 0; object-fit: cover;"
                         alt="Foto do mecânico">
                    <p style="margin-top: 8px;">Trocar foto</p>
                </label>
                <input type="file" id="editFotoMecanicoInput" name="fotoPerfil" accept="image/*" style="display:none;" onchange="previewImagemEdit(event)">
            </div>
    
            <label for="editNome">Nome completo</label>
            <input type="text" id="editNome" name="nomeCompleto" required>

            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" name="email" required>

            <label for="editSenha">Senha</label>
            <input type="password" id="editSenha" name="senha" required minlength="3">

            <label for="editTelefone">N° Telefone</label>
            <input type="tel" id="editTelefone" name="numeroTelefone" required
                   pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(99) 99999-9999">

            <label>Horário de Trabalho</label>
            <div style="display:flex; gap: 15px;">
                <div>
                    <label for="editManhaInicio">Manhã Início</label>
                    <input type="time" id="editManhaInicio" name="turnoManhaInicioString" required>
                </div>
                <div>
                    <label for="editManhaFim">Manhã Fim</label>
                    <input type="time" id="editManhaFim" name="turnoManhaFimString" required>
                </div>
            </div>

            <div style="display:flex; gap: 15px; margin-top: 10px;">
                <div>
                    <label for="editTardeInicio">Tarde Início</label>
                    <input type="time" id="editTardeInicio" name="turnoTardeInicioString" required>
                </div>
                <div>
                    <label for="editTardeFim">Tarde Fim</label>
                    <input type="time" id="editTardeFim" name="turnoTardeFimString" required>
                </div>
            </div>
            
            <div style="display:flex; justify-content:space-between; margin-top: 20px;">
                <button type="button" onclick="document.getElementById('modalEditarMecanico').style.display='none'">Cancelar</button>
                <button type="submit" class="btn-finalizar">Finalizar</button>
            </div>
        </form>
    </div>
</div>

<div id="modalConfirmarExclusao" class="modal-custom" style="display:none;">
    <div class="modal-content-custom" style="text-align: center;">
        <span class="close-btn" onclick="document.getElementById('modalConfirmarExclusao').style.display='none'">&times;</span>
        
        <h3 class="titulo-centro" style="color: #dc3545;">Confirmar Exclusão</h3>
        
        <p style="margin: 20px 0; font-size: 1.1em;">
            Tem certeza que deseja remover este mecânico permanentemente? <br>
            <small style="color: #666;">Essa ação não pode ser desfeita.</small>
        </p>

        <form id="formConfirmarExclusao" method="post">
            
            <div th:if="${_csrf != null}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </div>

            <div style="display:flex; justify-content:center; gap: 20px; margin-top: 25px;">
                <button type="button" 
                        class="btn-cancelar" 
                        onclick="document.getElementById('modalConfirmarExclusao').style.display='none'"
                        style="width: 100px; display: block;">
                    Cancelar
                </button>
                
                <button type="submit" 
                        class="btn-finalizar" 
                        style="background-color: #dc3545; width: 100px; border-color: #dc3545;">
                    Sim, excluir
                </button>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/footer :: rodape}"></footer>

<script>
    // --- Lógica Oficina ---
    const btnEditar = document.getElementById('btnEditar');
    const btnSalvar = document.getElementById('btnSalvar');
    const btnCancelar = document.getElementById('btnCancelar');
    const inputsOficina = document.querySelectorAll('.campo-editavel');
    const btnSalvarForm = document.getElementById('btnSalvarForm');

    btnEditar.addEventListener('click', function() {
        inputsOficina.forEach(input => input.removeAttribute('readonly'));
        btnEditar.style.display = 'none';
        btnSalvar.style.display = 'block';
        btnCancelar.style.display = 'block';
    });

    btnCancelar.addEventListener('click', function() {
        window.location.reload();
    });

    btnSalvar.addEventListener('click', function() {
        btnSalvarForm.click();
    });

    // --- Lógica Mecânicos (Toggle Remover) ---
    const btnToggleRemover = document.getElementById('btnToggleRemover');
    let modoRemocaoAtivo = false;

    btnToggleRemover.addEventListener('click', function() {
        modoRemocaoAtivo = !modoRemocaoAtivo;
        
        // Seleciona todos os botões de remover individuais
        const btnsIndividuais = document.querySelectorAll('.btn-remover-individual');

        if (modoRemocaoAtivo) {
            btnToggleRemover.innerText = 'Cancelar Remoção';
            btnsIndividuais.forEach(btn => btn.style.display = 'block');
        } else {
            btnToggleRemover.innerText = 'Remover';
            btnsIndividuais.forEach(btn => btn.style.display = 'none');
        }
    });

    // --- Nova Função: Abrir Modal de Exclusão ---
    function abrirModalExclusao(event, mecanicoId, oficinaId) {
        // Impede que o clique propague para o card (não abre o editar)
        if(event) event.stopPropagation();

        const modal = document.getElementById('modalConfirmarExclusao');
        const form = document.getElementById('formConfirmarExclusao');
        
        // Define a URL correta para deletar esse mecânico específico
        form.action = '/mecanicos/remover/' + mecanicoId + '/' + oficinaId;
        
        // Mostra o modal
        modal.style.display = 'block';
    }

    // --- Lógica Mecânicos (Modal Editar) ---
    function abrirModalEdicao(card) {
        // Se estiver clicando no botão remover (que é filho), não faz nada aqui
        // (Já tratado no onclick do botão remover, mas segurança extra)
        
        const id = card.getAttribute('data-id');
        const nome = card.getAttribute('data-nome');
        const email = card.getAttribute('data-email');
        const senha = card.getAttribute('data-senha');
        const telefone = card.getAttribute('data-telefone');
        const manhaInicio = card.getAttribute('data-manha-inicio');
        const manhaFim = card.getAttribute('data-manha-fim');
        const tardeInicio = card.getAttribute('data-tarde-inicio');
        const tardeFim = card.getAttribute('data-tarde-fim');
        const foto = card.getAttribute('data-foto');

        const formEditar = document.getElementById('formEditarMecanico');
        formEditar.action = '/mecanicos/editar/' + id;

        document.getElementById('editNome').value = nome;
        document.getElementById('editEmail').value = email;
        document.getElementById('editTelefone').value = telefone;
        document.getElementById('editSenha').value = senha;

        document.getElementById('editManhaInicio').value = manhaInicio || '';
        document.getElementById('editManhaFim').value = manhaFim || '';
        document.getElementById('editTardeInicio').value = tardeInicio || '';
        document.getElementById('editTardeFim').value = tardeFim || '';

        const imgPreview = document.getElementById('previewFotoEditar');
        if (foto && foto !== 'null' && foto !== '') {
            imgPreview.src = '/uploads/' + foto;
        } else {
            imgPreview.src = '/images/Perfil.png';
        }

        document.getElementById('modalEditarMecanico').style.display = 'block';
    }

    // Previews de Imagens
    function previewImagemAdd(event) {
        const input = event.target;
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewFotoAdd').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function previewImagemEdit(event) {
        const input = event.target;
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('previewFotoEditar').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
