<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página da Oficina</title>
    <link rel="stylesheet" th:href="@{/css/oficina-home.css}">
</head>

<body>

<header th:replace="~{fragments/header :: cabecalho}"></header>

<div class="container">

    <div th:if="${sucesso}" class="alerta-sucesso">
        <p th:text="${sucesso}"></p>
    </div>
    <div th:if="${erro}" class="alerta-erro">
        <p th:text="${erro}"></p>
    </div>

    <h2 class="titulo-centro">Imagem da oficina</h2>

    <div class="foto-oficina-box">
        <img class="foto-oficina"
             th:src="@{'/uploads/' + ${oficina.imagem}} + '?v=' + ${#dates.createNow().time}"
             id="previewFotoOficina"
             alt="Foto da Oficina">

        <button class="btn-alterar-foto" onclick="document.getElementById('inputFotoOficina').click();">
            Alterar foto
        </button>

        <form th:action="@{/oficinas/alterar-foto/{id}(id=${oficina.id})}"
              method="post"
              enctype="multipart/form-data">
            <input type="file"
                   id="inputFotoOficina"
                   name="novaFoto"
                   accept="image/*"
                   style="display:none"
                   onchange="previewAndSubmit(event, this.form)">
        </form>
    </div>

    <p class="id-oficina">ID: <span th:text="${oficina.id}"></span></p>

    <h2 class="titulo-centro">Informações</h2>

    <div style="width:100%; display:flex; justify-content:flex-end; margin-bottom:15px;">
        <button id="btnEditar" class="btn-editar">Editar</button>
        <button id="btnSalvar" class="btn-salvar" style="display:none;">Salvar</button>
        <button id="btnCancelar" class="btn-cancelar" style="display:none;">Cancelar</button>
    </div>

    <form id="formAtualizar"
          th:action="@{/oficinas/atualizar/{id}(id=${oficina.id})}"
          method="post">

        <div class="info-container">
            <div class="info-col-esq">
                <label>Nome</label>
                <input type="text" name="nomeDaOficina" th:value="${oficina.nomeDaOficina}" class="campo-editavel" readonly>

                <label>CNPJ</label>
                <input type="text" name="cnpj" th:value="${oficina.cnpj}" class="campo-editavel" readonly>

                <label>Cidade</label>
                <input type="text" name="cidade" th:value="${oficina.cidade}" class="campo-editavel" readonly>

                <label>Bairro</label>
                <input type="text" name="bairro" th:value="${oficina.bairro}" class="campo-editavel" readonly>

                <label>Rua</label>
                <input type="text" name="rua" th:value="${oficina.rua}" class="campo-editavel" readonly>
            </div>

            <div class="info-col-dir">
                <label>Número de telefone</label>
                <input type="text" name="telefoneDoProprietario" th:value="${oficina.telefoneDoProprietario}" class="campo-editavel" readonly>

                <label>Descrição</label>
                <textarea rows="11" name="descricao" class="campo-editavel" readonly
                          th:text="${oficina.descricao}">
                </textarea>
            </div>
        </div>

        <button id="btnSalvarForm" type="submit" style="display:none;"></button>
    </form>

    <h2 class="titulo-centro">Mecânicos</h2>

    <div class="botoes-mecanicos">
        <button class="btn-remover" id="btnRemoverMecanico">Remover</button>
        <button class="btn-adicionar" onclick="document.getElementById('modalAdicionarMecanico').style.display='block'">Adicionar</button>
    </div>

<div class="mecanicos-grid">
    <div class="card-mecanico"
         th:each="mecanico : ${mecanicos}"
         th:id="'mecanico-' + ${mecanico.id}"
         th:attr="data-id=${mecanico.id},
                  data-nome=${mecanico.nomeCompleto},
                  data-email=${mecanico.email},
                  data-senha=${mecanico.senha},
                  data-telefone=${mecanico.numeroTelefone},
                  data-manha-inicio=${mecanico.turnoManhaInicio},
                  data-manha-fim=${mecanico.turnoManhaFim},
                  data-tarde-inicio=${mecanico.turnoTardeInicio},
                  data-tarde-fim=${mecanico.turnoTardeFim}"
         onclick="abrirModalEdicao(this)"
         style="cursor:pointer;">

        <img th:if="${mecanico.nomeArquivoFoto != null and mecanico.nomeArquivoFoto != ''}"
             th:src="|/uploads/${mecanico.nomeArquivoFoto}?v=${#dates.createNow().time}|"
             alt="Mecânico">
        <img th:unless="${mecanico.nomeArquivoFoto != null and mecanico.nomeArquivoFoto != ''}"
             th:src="@{/images/perfil-default.png}"
             alt="Sem Foto">

        <p class="nome-mecanico" th:text="${mecanico.nomeCompleto}"></p>

        <button class="btn-remover-individual"
                th:attr="onclick='removerMecanico(' + ${mecanico.id} + ',' + ${oficina.id} + ')'"
                style="display:none;">
            Remover
        </button>
    </div>

    <p th:if="${#lists.isEmpty(mecanicos)}"
       style="grid-column: span 4; text-align: center; color: #666;">
        Nenhum mecânico cadastrado.
    </p>
</div>

</div> 

<!-- Modal de cadastro de mecânico -->
<div id="modalAdicionarMecanico" class="modal-custom" style="display:none;">
    <div class="modal-content-custom">
        <span class="close-btn" onclick="document.getElementById('modalAdicionarMecanico').style.display='none'">&times;</span>
        
        <h3 class="titulo-centro">Adicionando mecânico</h3>

        <form th:action="@{/mecanicos/adicionar/{oficinaId}(oficinaId=${oficina.id})}"
              method="post"
              enctype="multipart/form-data"
              th:object="${mecanicoDto}">

            <div style="text-align: center; margin-bottom: 20px;">
                <label for="inputFotoMecanico" style="cursor: pointer;">
                    <img th:src="@{/images/Perfil.png}" style="width: 80px; height: 80px; border-radius: 50%; border: 0px solid #ddd;" alt="Adicionar foto">
                    <p>Adicionar foto</p>
                </label>
                <input type="file" id="inputFotoMecanico" name="fotoPerfil" accept="image/*" style="display:none;">
            </div>
            
            <label for="nomeCompleto">Nome completo</label>
            <input type="text" id="nomeCompleto" th:field="*{nomeCompleto}" required minlength="3" maxlength="100"
                   pattern="^[A-Za-zÀ-ÿ\s]+$" title="Digite apenas letras e espaços.">

            <label for="email">Crie um email</label>
            <input type="email" id="email" th:field="*{email}" required title="Digite um email válido.">

            <label for="senha">Crie uma senha</label>
            <input type="password" id="senha" th:field="*{senha}" required minlength="3" maxlength="20"
                   title="A senha deve ter no mínimo 6 caracteres.">

            <label for="telefone">N° Telefone</label>
            <input type="tel" id="telefone" th:field="*{numeroTelefone}" required 
                   pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(99) 99999-9999"
                   title="Formato esperado: (99) 99999-9999">
            
            <label>Horário de Trabalho</label>
            <div style="display:flex; justify-content:space-between; gap: 15px;">
                <div>
                    <label for="manhaInicio">Manhã Início</label>
                    <input type="time" id="manhaInicio" th:field="*{turnoManhaInicioString}" required>
                </div>
                <div>
                    <label for="manhaFim">Manhã Fim</label>
                    <input type="time" id="manhaFim" th:field="*{turnoManhaFimString}" required>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; gap: 15px; margin-top: 10px;">
                <div>
                    <label for="tardeInicio">Tarde Início</label>
                    <input type="time" id="tardeInicio" th:field="*{turnoTardeInicioString}" required>
                </div>
                <div>
                    <label for="tardeFim">Tarde Fim</label>
                    <input type="time" id="tardeFim" th:field="*{turnoTardeFimString}" required>
                </div>
            </div>
            
            <div style="display:flex; justify-content:space-between; margin-top: 20px;">
                <button type="button" onclick="document.getElementById('modalAdicionarMecanico').style.display='none'">Cancelar</button>
                <button type="submit" class="btn-finalizar">Finalizar</button>
            </div>
        </form>
    </div>
</div>

<div id="modalEditarMecanico" class="modal-custom" style="display:none;">
    <div class="modal-content-custom">
        <span class="close-btn" onclick="document.getElementById('modalEditarMecanico').style.display='none'">&times;</span>
        <h3 class="titulo-centro">Alterar informações do mecânico</h3>

        <form id="formEditarMecanico" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" id="editId">
    		<input type="hidden" name="oficinaId" th:value="${oficina.id}">
    
    		<input type="file" id="editFotoMecanico" name="fotoPerfil" accept="image/*">

			<div style="text-align: center; margin-bottom: 20px;">
        		<label for="editFotoMecanico" style="cursor: pointer; display: inline-block;">
		    <img id="previewFotoEditar"
		         th:src="${mecanico != null and mecanico.nomeArquivoFoto != null and mecanico.nomeArquivoFoto != ''}
		                 ? @{|/uploads/${mecanico.nomeArquivoFoto}|}
		                 : @{/images/Perfil.png}"
		         style="width: 80px; height: 80px; border-radius: 50%; border: 0; object-fit: cover;"
		         alt="Foto do mecânico">
		    <p style="margin-top: 8px;">Trocar foto</p>
		  </label>
        		<input type="file" id="editFotoMecanico" name="fotoPerfil" accept="image/*" style="display:none;">
    		</div>
    
            <label for="editNome">Nome completo</label>
            <input type="text" id="editNome" name="nomeCompleto" required>

            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" name="email" required>

            <label for="editSenha">Senha</label>
            <input type="password" id="editSenha" name="senha" required minlength="3">

            <label for="editTelefone">N° Telefone</label>
            <input type="tel" id="editTelefone" name="numeroTelefone" required
                   pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(99) 99999-9999">

            <label>Horário de Trabalho</label>
            <div style="display:flex; gap: 15px; ">
                <div>
                    <label for="editManhaInicio">Manhã Início</label>
                    <input type="time" id="editManhaInicio" name="turnoManhaInicioString" required>
                </div>
                <div>
                    <label for="editManhaFim">Manhã Fim</label>
                    <input type="time" id="editManhaFim" name="turnoManhaFimString" required>
                </div>
            </div>

            <div style="display:flex; gap: 15px; margin-top: 10px;">
                <div>
                    <label for="editTardeInicio">Tarde Início</label>
                    <input type="time" id="editTardeInicio" name="turnoTardeInicioString" required>
                </div>
                <div>
                    <label for="editTardeFim">Tarde Fim</label>
                    <input type="time" id="editTardeFim" name="turnoTardeFimString" required>
                </div>
            </div>
            
            <input type="hidden" name="oficinaId" th:value="${oficina.id}">
            

            <div style="display:flex; justify-content:space-between; margin-top: 20px;">
                <button type="button" onclick="document.getElementById('modalEditarMecanico').style.display='none'">Cancelar</button>
                <button type="submit" class="btn-finalizar">Finalizar</button>
            </div>
        </form>
    </div>
</div>

<div th:if="${param.logout}" class="alert alert-success">
    Você saiu com sucesso.
</div>


<footer th:replace="~{fragments/footer :: rodape}"></footer>

<!-- JS da página -->
<script th:src="@{/js/oficina-home.js}"></script>
<script th:src="@{/js/remover-mecanico.js}"></script>
</body>
</html>
