<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Etapa 3</title>
    <link rel="stylesheet" th:href="@{/css/cadastro-etapa3.css}">
</head>

<body>

<!-- HEADER -->
<header th:replace="~{fragments/header :: cabecalho}"></header>

<!-- CONTEÚDO CENTRAL -->
<div class="conteudo">

    <p class="titulo">Pegue o ID da oficina com o proprietário e digite abaixo</p>

    <!-- Usa dto como objeto, igual ao controller -->
    <form th:action="@{/clientes/cadastro/etapa3}" th:object="${dto}" method="post">
        
        <!-- Campo correto para o DTO: oficinaId -->
        <input type="text" th:field="*{oficinaId}" placeholder="Digite o ID da oficina" required>
        
        <button type="submit" class="btn-enviar">Adicionar oficina</button>
    </form>

</div>

<!-- FOOTER -->
<footer th:replace="~{fragments/footer :: rodape}"></footer>
</body>
</html>
