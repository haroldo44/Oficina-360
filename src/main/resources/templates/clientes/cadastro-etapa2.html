<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro-etapa2</title>
	<link rel="stylesheet" th:href="@{/css/cadastro-etapa2-cliente.css}">
</head>

<body>

<div class="container-flex">

    <!-- LADO ESQUERDO -->
    <div class="left">
        <img class="logo" src="/images/logo-da-oficina.png" alt="Logo Oficina 360">

        <h3>Finalizando a sua conta</h3>

        <div class="circle-photo"></div>
        <p class="add-photo">Adicionar foto</p>

        <div class="form-box">

            <form th:action="@{/clientes/cadastro/etapa3}" th:object="${cliente}" method="post">

                <input type="text" placeholder="Digite seu nome completo" th:field="*{nome}">
                <div th:if="${#fields.hasErrors('nome')}" class="text-danger">
                    <p th:errors="*{nome}"></p>
                </div>

                <input type="text" placeholder="Digite seu CPF" th:field="*{cpf}">
                <div th:if="${#fields.hasErrors('cpf')}" class="text-danger">
                    <p th:errors="*{cpf}"></p>
                </div>

                <input type="text" placeholder="Digite o nome da sua cidade" th:field="*{cidade}">
                <div th:if="${#fields.hasErrors('cidade')}" class="text-danger">
                    <p th:errors="*{cidade}"></p>
                </div>

                <input type="text" placeholder="Digite o nome do bairro" th:field="*{bairro}">
                <input type="text" placeholder="Digite o nome da rua" th:field="*{rua}">

                <button class="btn-black" type="submit">Finalizar</button>
            </form>

        </div>

    </div>

    <!-- LADO DIREITO -->
    <div class="right">
        <img class="illustration" src="/images/Desenho da tela de login.png" alt="">
    </div>

</div>

</body>
</html>
