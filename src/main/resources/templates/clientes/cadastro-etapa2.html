<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Etapa 2</title>
    <link rel="stylesheet" th:href="@{/css/cadastro-etapa2-cliente.css}">
</head>
<body>
<div class="container-flex">
    <div class="left">
        <img class="logo" th:src="@{/images/logo-da-oficina.png}" alt="Logo Oficina 360">
        <h3>Finalizando a sua conta</h3>
        <div class="form-box">
            <form th:action="@{/clientes/cadastro/etapa2}" th:object="${dto}" method="post" enctype="multipart/form-data">
            
                <div class="photo-container">
            		<label for="fotoClienteArquivo" class="circle-photo">
                        <img id="previewImagem" 
                             th:src="@{/images/Perfil.png}" 
                             alt="Foto padrão"
                             style="object-fit: cover; width: 100%; height: 100%; border-radius: 50%;">
            		</label>

            		<label for="fotoClienteArquivo" class="add-photo-text" style="cursor: pointer;">Adicionar foto</label>
            		
                    <input type="file" id="fotoClienteArquivo" name="fotoClienteArquivo" accept="image/*" style="display: none;">
        		</div>
        		
                <input type="text" th:field="*{nome}" placeholder="Digite seu nome completo" required>
                <div th:if="${#fields.hasErrors('nome')}" class="text-danger">
                    <p th:errors="*{nome}"></p>
                </div>

                <input type="text" 
                       th:field="*{cpf}" 
                       placeholder="Digite seu CPF" 
                       required
                       maxlength="14"
                       pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                       title="Digite o CPF no formato xxx.xxx.xxx-xx"
                       oninput="mascaraCPF(this)">
                
                <div th:if="${#fields.hasErrors('cpf')}" class="text-danger">
                    <p th:errors="*{cpf}"></p>
                </div>

                <input type="text" 
                       th:field="*{contato}" 
                       placeholder="Digite seu telefone (xx) xxxxx-xxxx"
                       maxlength="15"
                       pattern="\(\d{2}\) \d{5}-\d{4}"
                       title="Digite o telefone no formato (xx) xxxxx-xxxx"
                       oninput="mascaraTelefone(this)">

                <input type="text" th:field="*{cidade}" placeholder="Digite sua cidade">
                <input type="text" th:field="*{bairro}" placeholder="Digite seu bairro">
                <input type="text" th:field="*{rua}" placeholder="Digite sua rua">

                <button class="btn-black" type="submit">Próxima etapa</button>
            </form>
        </div>
    </div>
    <div class="right">
        <img class="illustration" th:src="@{/images/Desenho da tela de login.png}" alt="Ilustração">
    </div>
</div>

<script>
    // Script de Preview da Imagem
    document.getElementById('fotoClienteArquivo').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('previewImagem');
                img.src = e.target.result; 
            }
            reader.readAsDataURL(file); 
        }
    });

    // --- MÁSCARA PARA CPF ---
    function mascaraCPF(input) {
        let value = input.value;
        
        // Remove tudo que não é número
        value = value.replace(/\D/g, "");
        
        // Adiciona os pontos e traço
        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d)/, "$1.$2");
        value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        
        input.value = value;
    }

    // --- MÁSCARA PARA TELEFONE ---
    function mascaraTelefone(input) {
        let value = input.value;
        
        // Remove tudo que não é número
        value = value.replace(/\D/g, "");
        
        // Coloca parênteses em volta dos dois primeiros dígitos
        value = value.replace(/^(\d{2})(\d)/g, "($1) $2");
        
        // Coloca hífen entre o quinto e o sexto dígitos
        value = value.replace(/(\d)(\d{4})$/, "$1-$2");
        
        input.value = value;
    }
</script>

</body>
</html>
