<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Cliente</title>
    <link rel="stylesheet" th:href="@{/css/tela-inicial-cliente.css}">
</head>
<body>

<header th:replace="~{fragments/header :: cabecalho}" class="header-custom"></header>

<main class="container">

    <!-- CARTÃO DE PERFIL -->
    <section class="profile-card">
        <!-- FOTO DO CLIENTE -->
        <div class="profile-photo">
            <img th:if="${cliente.foto != null}" th:src="@{'/uploads/' + ${cliente.foto}}" alt="Foto do cliente">
            <img th:if="${cliente.foto == null}" th:src="@{/images/perfil-default.png}" alt="Foto padrão">
        </div>

        <!-- INFORMAÇÕES DO CLIENTE -->
        <div class="profile-info">
            <h1 th:text="${cliente.nome}">Nome do Cliente</h1>

            <div class="profile-columns">
                <div class="profile-col">
                    <p><strong>CPF:</strong> <span th:text="${cliente.cpf}">000.000.000-00</span></p>
                    <p><strong>Contato:</strong> <span th:text="${cliente.contato}">(00) 00000-0000</span></p>
                    <p><strong>Cidade:</strong> <span th:text="${cliente.cidade}">Cidade</span></p>
                </div>

                <div class="profile-col">
                    <p><strong>Bairro:</strong> <span th:text="${cliente.bairro}">Bairro</span></p>
                    <p><strong>Rua:</strong> <span th:text="${cliente.rua}">Rua</span></p>
                    <p><strong>ID da oficina vinculada:</strong>
                        <span th:if="${cliente.oficina != null}">
                            <a th:href="@{/oficinas/home/{id}(id=${cliente.oficina.id})}" 
                               th:text="${cliente.oficina.id}" 
                               class="link-oficina"></a>
                        </span>
                        <span th:if="${cliente.oficina == null}">—</span>
                    </p>
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="profile-actions">
                <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-black">
                    Editar perfil
                </a>

                <form th:action="@{/clientes/excluir/{id}(id=${cliente.id})}" method="post" 
                      onsubmit="return confirm('Tem certeza que deseja excluir sua conta? Esta ação não pode ser desfeita.');">
                    <button type="submit" class="btn btn-red">
                        EXCLUIR CONTA
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- SEÇÃO EXTRA -->
    <section class="profile-extra">
        <div class="card">
            <h3>Informações adicionais</h3>
            <p>Aqui você pode mostrar histórico de serviços, preferências, observações ou outros dados relevantes do cliente.</p>
        </div>
    </section>

</main>

<footer th:replace="~{fragments/footer :: rodape}"></footer>

</body>
</html>
