<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Etapa 1</title>
    <link rel="stylesheet" th:href="@{/css/cadastro-etapa1-cliente.css}">
</head>
<body>
<div class="container-flex">
    <div class="left">
        <img class="logo" th:src="@{/images/logo-da-oficina.png}" alt="Logo Oficina 360">

        <div class="form-box">
            <h3>Crie sua conta</h3>

            <!-- O DTO precisa estar no model como "dto" -->
            <form th:action="@{/clientes/cadastro/etapa1}" th:object="${dto}" method="post">

                <!-- Email -->
                <input type="email" th:field="*{email}" placeholder="Digite seu email" required>
                <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                    <p th:errors="*{email}"></p>
                </div>

                <!-- Senha -->
                <input type="password" th:field="*{senha}" placeholder="Digite sua senha" required>
                <div th:if="${#fields.hasErrors('senha')}" class="text-danger">
                    <p th:errors="*{senha}"></p>
                </div>

                <!-- Confirmar Senha -->
                <input type="password" th:field="*{confirmarSenha}" placeholder="Confirmar senha" required>
                <div th:if="${#fields.hasErrors('confirmarSenha')}" class="text-danger">
                    <p th:errors="*{confirmarSenha}"></p>
                </div>

                <button class="btn-black" type="submit">Próxima etapa</button>
            </form>
        </div>
    </div>

    <div class="right">
        <img class="illustration" th:src="@{/images/Desenho da tela de login.png}" alt="Ilustração">
    </div>
</div>
</body>
</html>
